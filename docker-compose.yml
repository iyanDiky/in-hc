services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: in_hc_backend
    restart: unless-stopped
    working_dir: /var/www/backend
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: warning
    volumes:
      - ./backend:/var/www/backend
    networks:
      - in_hc_network
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    container_name: in_hc_webserver
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - in_hc_network
    depends_on:
      - backend

  db:
    image: postgres:15
    container_name: in_hc_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-in_hc}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - in_hc_network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: in_hc_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - webserver
    networks:
      - in_hc_network

networks:
  in_hc_network:
    driver: bridge

volumes:
  db_data:
